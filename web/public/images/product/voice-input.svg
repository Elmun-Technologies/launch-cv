  <circle cx="648" cy="330" r="6" fill="#DB2777"/>
  <text x="666" y="336" fill="#9D174D" font-size="16" font-weight="600">Listening…</text>

  <!-- transcript -->
  <rect x="112" y="420" width="640" height="300" rx="16" fill="#FAFBFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="140" y="462" fill="#94A3B8" font-size="14" font-weight="700" letter-spacing="1">TRANSCRIPT</text>
  <g fill="#475569" font-size="20">
    <text x="140" y="506">so I basically ran the whole onboarding</text>
    <text x="140" y="538">redesign thing and signups went up like</text>
    <text x="140" y="570">a third, and I also mentored a couple of</text>
