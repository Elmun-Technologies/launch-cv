<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <rect width="1600" height="900" fill="#F0FDFA"/>
  <rect x="60" y="70" width="1480" height="760" rx="24" fill="#FFFFFF"/>
  <rect x="60" y="70" width="1480" height="760" rx="24" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M60 94a24 24 0 0 1 24-24h1432a24 24 0 0 1 24 24v52H60z" fill="#FAFBFC"/>
  <line x1="60" y1="146" x2="1540" y2="146" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="100" cy="108" r="8" fill="#FF5F57"/>
  <circle cx="128" cy="108" r="8" fill="#FEBC2E"/>
  <circle cx="156" cy="108" r="8" fill="#28C840"/>
  <rect x="620" y="94" width="360" height="28" rx="14" fill="#EEF2F7"/>
  <text x="800" y="113" text-anchor="middle" fill="#94A3B8" font-size="15" font-weight="500">app.launch-cv.com/cover-letter</text>

  <!-- controls -->
  <text x="112" y="210" fill="#94A3B8" font-size="15" font-weight="700" letter-spacing="1">TONE</text>
  <rect x="112" y="228" width="150" height="44" rx="10" fill="#0D9488"/>
  <text x="187" y="256" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600">Professional</text>
  <rect x="276" y="228" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="346" y="256" text-anchor="middle" fill="#475569" font-size="16" font-weight="600">Enthusiastic</text>
  <rect x="430" y="228" width="110" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="485" y="256" text-anchor="middle" fill="#475569" font-size="16" font-weight="600">Concise</text>

  <text x="620" y="210" fill="#94A3B8" font-size="15" font-weight="700" letter-spacing="1">LANGUAGE</text>
  <rect x="620" y="228" width="150" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="695" y="256" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="600">English ▾</text>

  <rect x="1280" y="228" width="180" height="44" rx="10" fill="#0D9488"/>
  <text x="1370" y="256" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="600">Generate letter</text>

  <!-- letter document -->
  <rect x="112" y="308" width="1348" height="452" rx="16" fill="#FAFBFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="160" y="360" fill="#0F172A" font-size="21" font-weight="700">Dear Ms. Rivera,</text>
  <g fill="#334155" font-size="19">
    <text x="160" y="404">When I led the migration of 200,000 customer records to a new data</text>
    <text x="160" y="434">platform, I learned the real challenge was never the technology — it was</text>
    <text x="160" y="464">the people. That's why your <tspan fill="#0D9488" font-weight="700">Head of Engineering</tspan> role caught my eye.</text>
  </g>
  <rect x="152" y="498" width="1268" height="70" rx="10" fill="#CCFBF1"/>
  <g fill="#134E4A" font-size="19">
    <text x="168" y="528">At Northwind I cut deployment time 40% and mentored 8 engineers —</text>
    <text x="168" y="556">directly relevant to the platform reliability goals in your posting.</text>
  </g>
  <g fill="#334155" font-size="19">
    <text x="160" y="606">I'd welcome the chance to discuss how that experience could help your</text>
    <text x="160" y="636">team ship faster this year.</text>
  </g>
  <text x="160" y="694" fill="#0F172A" font-size="19">Warm regards,</text>
  <text x="160" y="724" fill="#0F172A" font-size="19" font-weight="600">Sarah Khan</text>

  <rect x="1180" y="672" width="240" height="40" rx="20" fill="#F0FDFA" stroke="#99F6E4" stroke-width="2"/>
  <text x="1300" y="698" text-anchor="middle" fill="#0F766E" font-size="16" font-weight="600">312 words · 58 seconds</text>
</svg>
